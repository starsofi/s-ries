<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estilo</title>

    <!-- CSS interno -->
     <!-- Ele fica dentro da tag <style> no <head> do HTML -->
        <style>
            h1 {color:red;
            }
        </style>
        <!-- O MELHOR CSS -->
         <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- CSS (Cascading Style Sheets) é o que dá forma,cor, design e estilo ao HTML-->

    <!-- CSS inline -->
     <!-- Definido diretamente na tag HTML, dentro do atributo style="" -->
      <h1 style="font-size: 120px;">Título em Vermelho</h1>
<h2>Soso</h2>


</body>
</html>
