 <!DOCTYPE html>
    <html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
    
<head>
 <!--A semântica no HTML significa usar as tags certas para cada tipo de conteúdo, ajudando navegadores, mecanismo de busca e leitores de tela a entenderem melhor a estrutura da página --! >

  < !-- Benefícios do HTML Semântico  -->

 <!-- Melhora a acessibilidade(Leitores de tela conseguem interpretar melhor) 
 Melhora SEO (O Google entende melhor a estrutura do site)
 Facilita a manutenção do código(código mais organizado e legível)
 Ajuda na responsividade(tags semânticas trabalham melhor com CSS e JS) -->
</head>
<body>

    <!-- Sem Semântica -->
     <!-- <a href="#">ínicio<a/> -->
       
       
        <!-- HTML Semântico -->
<header>
    <!-- O topo do site ou de uma seção(Logo, título e menu de navegação) -->
    <nav>
        <!-- Contém links de navegação para outras partes do site -->
        <a href="">Ínicio</a>
        <a href="">Sobre</a>
    </nav>
</header>
<main>
    <!-- Contém o conteúdo principal da página -->
    <h1>Noticias ao vivo do sesi</h1>
   <section> <h2>Últimas Noticias</h2>
    <p>hoje foi anunciado um novo projeto...</p>

    <article>
        <!-- Representa um conteúdo independente e autocontido,que pode ser ditribuido ou reutilizado separadamente sem perder o sentido. Ex: Postagens, BLOG, Noticias, comentários de usuários, Cards de produtos, artigos de revista,-->
        <h3>Os alunos ama ir para o SESI</h3>
        <p>Descrição...</p>
    </article>
</section>


<aside>
    <!--TAG usada para conteúdos secundários ou complementares,que não fazem parte do fluxo principal do documento.Normalmente, ela aparece como:
    -Barras laterais
    -Informações adicionais
    -Anúncios -->
    <h3>vídeos recomendados</h3>
</aside>


</main>
     <footer>
        <!-- representa o rodapé da página, contendo informações como copyright e links secundários
         Quando usar?
         -Final da páginaa -->
        <p>2026 facebook🗽🗽🌆 AGNES GOSTA DO PIDRU Todos os direitos reservados</p>
     </footer>
    
</body>
</html>
